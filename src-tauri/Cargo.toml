[package]
name = "easypdf"
version = "1.0.0"
description = "Private, offline PDF toolkit"
authors = ["Marwan Alnabhani"]
license = "MIT"
edition = "2021"

[lib]
name = "easypdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
percent-encoding = "2"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast release binary.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
